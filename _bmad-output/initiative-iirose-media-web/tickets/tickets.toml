slug = "epic-playback-loop-shuffle"
title = "侧栏单曲循环与收藏随机播放"
description = "在真实站点桌面与移动视口：开启单曲循环后一首歌播到剩余 5 秒时无缝回到开头继续播（无权限时在结束前续上同一首）并只有一个按钮点亮；点随机弹出面板，勾选两首单曲加某歌单里的三首后确认，连续自动播放的曲目全部落在这五首内、无公屏消息污染，刷新后再开面板仍是这五首；切到「按歌曲」后整单 100 首的歌单明显占多数。他人点播期间两者零动作并保持待命；换房、断线、刷新后按钮回到熄灭且不产生任何自动发送。"
covers = []

[[epic]]
id = 5
slug = "epic-collection-inner-batch"
title = "歌单/专辑内页多选点播、分段加载与批量即停"
description = "真站打开一个上万首歌单的内页：网络面板首屏前只见 1 次歌单详情 + 1 次歌曲详情，翻到第 10 页时才出现第二段请求；在内页跨两页勾选 3 首点「点播所选」，房间按点选顺序收到 3 首。对 200 首歌单整张点播，发出几首后点停止：此后网络面板不再出现该批次的网易云请求，房间不再收到新歌，2 秒后仍如此。"
covers = []

