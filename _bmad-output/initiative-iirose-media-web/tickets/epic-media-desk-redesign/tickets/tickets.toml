[[entry]]
id = 4
type = "story"
title = "手机操作条与逐层关闭"
description = "手机 action-sheet 与 Esc/宿站返回键逐层关闭、浮层焦点循环与归还（SPEC CAP-7、CAP-14）。"
verify = "Problem: 手机上点曲目行 / 视频缩略图 / 音乐网格卡的主体仍然直接点播（story 2 为了让点击不落空，先回落成点播），既没有「收藏」「选集」入口，也没有「先看清楚再决定」的一步。同时整个面板没有层级概念：内页 `Esc` 靠 DOM 探针 `[data-imw-order-menu]` 让位、顺序菜单自带一份 `document` 捕获监听、展开的底部条完全没有 `Esc`（按下直接关掉整个面板），宿站返回键（`Utils.backward`）从未被接管——按一下就把人扔出房间。"
covers = ["R7", "R14"]
after = []
hitl = false
risk = "low"
v6_key = "4"

[[entry]]
id = 5
type = "story"
title = "选集面板替代宿站 buildSelect2"
description = "插件自有选集面板（点选顺序徽章、全选、正序/乱序、点播所选），接入 B 站多 P、多源剧集与网易云歌单/专辑选集（SPEC CAP-8）。"
verify = "Problem: 选集今天全靠宿站 `buildSelect2`：B 站多 P 先开三级菜单（`buildBiliSelect`：正序/乱序/选集）→ 多选弹窗 → `setTimeout(300)` 后再开二次顺序确认（`buildOrderConfirmSelect`），两次流转都踩宿站 `fadeOut` 冲突；「点选顺序」靠 `IIROSEUtils.buildSelect2` 在 `setTimeout(0)` 里接管宿站选项 `onclick` 与确定按钮的补丁维持（`selectedQueue` + 序号徽章 + sticky 确定钮）；多源剧集只有「正序点播全部」，没有单选分集。这与 CAP-8（插件自有面板、点选顺序=播放顺序、全选按列表顺序、取消不点播）冲突，也让 stale 的宿站选择器长期留在点播链路里。"
covers = ["R8"]
after = []
hitl = false
risk = "low"
v6_key = "5"

