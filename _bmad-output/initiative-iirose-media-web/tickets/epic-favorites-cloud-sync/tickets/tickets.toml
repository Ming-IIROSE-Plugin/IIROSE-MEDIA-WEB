[[entry]]
id = 3
type = "story"
title = "收藏云同步：首次合并预览与确认"
description = "Problem: 首次启用同步时，云端与本地被静默并集后直接上传——用户只在事后从提示条看到「云端 137 / 本地 89 / 合并后 152」这几个数字，而那时数据已经写进云端了。并集不是你想要的，也没有回头路。更麻烦的是 `enable()` 在 `performSync` 之前就把 `enabled` 置真，于是预览若停留几秒，任何一次收藏增删都会让 5 秒防抖把未经确认的合并结果写上去。"
