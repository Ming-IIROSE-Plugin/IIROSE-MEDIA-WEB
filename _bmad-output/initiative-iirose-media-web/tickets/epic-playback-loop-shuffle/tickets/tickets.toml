type = "story"
title = "收藏随机与专辑歌单设置项"
description = "按面板 focus 平台从收藏抽曲，预取、去重、失败换曲与播报档位，并新增 「专辑/歌单参与随机」设置项（SPEC CAP-4、CAP-7，shuffle-mechanics.md）。"
verify = "Problem: 点亮「收藏随机」目前没有行为。想连续听自己的收藏，只能一条条手动点；而收藏里既有单曲也有专辑与歌单，后者整张播会打断随机节奏。"
covers = ["R4"]
after = []
hitl = false
risk = "low"
v6_key = "4"

[[entry]]
id = 5
type = "story"
title = "随机范围与权重数据层"
description = "随机只在面板确认的选择范围内抽取，支持按条目/按歌曲两种权重与按单首去重，选择按账号与平台存本机， 并退役「专辑/歌单参与随机」设置项（SPEC CAP-4、CAP-7、CAP-9、CAP-10，shuffle-mechanics.md）。"
verify = "Problem: 收藏随机现在从全部收藏里等概率抽「条目」：一首单曲和一个 100 首的歌单各占一份，用户既不能限定从哪些歌里随机，也不能让歌单里的每首歌与单曲同权。"
covers = ["R4", "R9", "R10"]
after = []
hitl = false
risk = "low"
v6_key = "5"

