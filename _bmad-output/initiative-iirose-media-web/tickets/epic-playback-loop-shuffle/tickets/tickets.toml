# 迁移自 v6:spec-playback-loop-shuffle

[[entry]]
id = 1
type = "story"
title = "侧栏开关行与点亮态"
description = "在宿站侧栏 IIROSE-MEDIA-WEB 分组内新增一行点亮式开关（单曲循环、收藏随机）， 含互斥单选、禁用态与原因、幂等重建与卸载清理（SPEC CAP-1，sidebar-controls.md）。"
verify = "Problem: 宿站侧栏的 IIROSE-MEDIA-WEB 分组目前只有「播放进度」一个入口，没有任何可常驻的播放模式开关；后续的单曲循环与收藏随机需要一个能承载多个按钮、状态一眼可辨的容器。"
covers = ["R1"]
after = []
hitl = false
risk = "low"
v6_key = "1"

[[entry]]
id = 2
type = "story"
title = "点播归属守卫与生命周期"
description = "以点播者字段判定本人点播，他人或未知时零动作待命；补齐换房、断线、媒体消失、 刷新、重复注入的停止与单实例语义（SPEC CAP-5、CAP-6，ownership-and-lifecycle.md）。"
verify = "Problem: 开关行现在只反映「有没有媒体、时长是否已知」，不知道当前曲目是谁点的，也不感知换房；一旦后续 story 接上自动点播，就会在别人点的歌上插手，或在换房后把旧状态带进新房间。重复注入还会各起一套控制器。"
covers = ["R5", "R6"]
after = []
hitl = false
risk = "low"
v6_key = "2"

[[entry]]
id = 3
type = "story"
title = "单曲循环：静默快退与预发重播"
description = "有媒体权限时剩余阈值内快退回 0；无权限时剩余 2 秒预发缓存的播放报文以抢在 宿站自动续播之前，含失败判定、迟发兜底与不抢占约束（SPEC CAP-2、CAP-3，loop-mechanics.md）。"
verify = "Problem: 开关点亮后目前没有任何行为。宿站曲目播完会自动续播下一首，要重复听同一首只能手动点回去；有媒体管理权限的人可以静默定位，没有权限的人只能在播完后重新点播，而重新点播需要插件自己发过的播放报文。"
covers = ["R2", "R3"]
after = []
hitl = false
risk = "low"
v6_key = "3"

