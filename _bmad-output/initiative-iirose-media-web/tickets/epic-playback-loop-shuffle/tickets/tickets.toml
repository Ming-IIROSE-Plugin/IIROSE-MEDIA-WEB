title = "面板内切换随机平台"
description = "选择面板顶部加入网易云/B站标签，首次按插件启动默认页面、之后按上次确认的平台打开；确认时保存改动过的平台选择 并记下随机平台，控制器改读这份记录而不跟随主插件焦点（SPEC CAP-11，shuffle-mechanics.md、shuffle-picker-panel.md）。"
